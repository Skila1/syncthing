name: Build & Deploy Multi-User Syncthing

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  GO_VERSION: "~1.26.0"
  TAGS_LINUX: "sqlite_omit_load_extension sqlite_dbstat netgo osusergo"

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set image name (lowercase)
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/syncthing-multiuser" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Setup Zig (for CGO cross-compilation)
        uses: mlugg/setup-zig@v2

      - name: Build binaries
        run: |
          mkdir -p bin

          # amd64
          go run build.go -goos linux -goarch amd64 \
            -tags "${{ env.TAGS_LINUX }}" \
            -cc "zig cc -target x86_64-linux-musl" \
            -no-upgrade build syncthing
          mv syncthing bin/syncthing-linux-amd64

          # arm64
          go run build.go -goos linux -goarch arm64 \
            -tags "${{ env.TAGS_LINUX }}" \
            -cc "zig cc -target aarch64-linux-musl" \
            -no-upgrade build syncthing
          mv syncthing bin/syncthing-linux-arm64
        env:
          CGO_ENABLED: "1"
          BUILD_USER: docker
          EXTRA_LDFLAGS: "-linkmode=external -extldflags=-static"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tags
        id: tags
        run: |
          sha=$(git rev-parse --short HEAD)
          echo "tags=${{ env.IMAGE_NAME }}:latest,${{ env.IMAGE_NAME }}:$sha" >> "$GITHUB_OUTPUT"

      - name: Prepare build context
        run: |
          mkdir ctx
          mv bin/* script ctx

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ctx
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
