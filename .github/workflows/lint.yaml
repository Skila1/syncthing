name: Lint

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  GO_VERSION: "~1.26.0"

jobs:
  golangci-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Install build deps (CGO/SQLite)
        run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev

      - name: Generate GUI assets
        run: go run build.go assets
        env:
          CGO_ENABLED: "1"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
          args: --build-tags "sqlite_omit_load_extension sqlite_dbstat"
        env:
          CGO_ENABLED: "1"

  go-vet:
    name: Go Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Install build deps (CGO/SQLite)
        run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev

      - name: Generate GUI assets
        run: go run build.go assets
        env:
          CGO_ENABLED: "1"

      - name: go vet
        run: go vet -tags "sqlite_omit_load_extension sqlite_dbstat" ./...
        env:
          CGO_ENABLED: "1"

  gofmt:
    name: Go Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            echo ""
            echo "Run 'gofmt -w .' to fix."
            exit 1
          fi
