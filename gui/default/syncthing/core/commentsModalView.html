<div id="commentsModal" class="modal fade" tabindex="-1" role="dialog">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
        <h4 class="modal-title">
          <span class="fas fa-comment"></span>
          <span translate>Comments</span>
          <small ng-if="commentView.filePath"> &mdash; {{commentView.filePath}}</small>
        </h4>
      </div>
      <div class="modal-body" style="max-height:400px; overflow-y:auto;">

        <div ng-if="commentView.loading" class="text-center" style="padding:20px;">
          <span class="fas fa-spinner fa-spin fa-2x"></span>
        </div>

        <div ng-if="!commentView.loading && commentView.list.length === 0" class="text-muted text-center" style="padding:30px;">
          <span class="fas fa-comments fa-3x"></span>
          <p translate style="margin-top:8px;">No comments yet. Be the first!</p>
        </div>

        <div ng-repeat="c in commentView.list" class="media" style="border-bottom:1px solid #eee; padding:8px 0;">
          <div class="media-body">
            <strong>{{c.username || ('User #' + c.userId)}}</strong>
            <small class="text-muted pull-right">{{c.createdAt | date:'short'}}</small>
            <p style="margin:4px 0 0 0;">{{c.content}}</p>
          </div>
          <div class="text-right" ng-if="c.userId === currentUser.id || isAdmin()">
            <button class="btn btn-xs btn-link text-danger" ng-click="deleteCommentItem(c)">
              <span class="fas fa-trash"></span>
            </button>
          </div>
        </div>

        <div class="text-center" ng-if="commentView.total > commentView.list.length" style="padding-top:8px;">
          <button class="btn btn-xs btn-default" ng-click="loadMoreComments()">
            <span translate>Load More</span>
          </button>
        </div>

      </div>
      <div class="modal-footer">
        <div class="input-group">
          <input type="text" class="form-control" ng-model="commentView.newContent" placeholder="Write a comment..." ng-keypress="$event.which === 13 && postCommentItem()" />
          <span class="input-group-btn">
            <button class="btn btn-primary" ng-click="postCommentItem()">
              <span class="fas fa-paper-plane"></span>
            </button>
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
